plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs.kotlin'
}
android {
    namespace 'com.deepcoder.hbalum'
    compileSdkVersion 36
    flavorDimensions "app"
    defaultConfig {
        applicationId "com.deepcoder.hbalum"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
        packagingOptions {
            exclude 'AndroidManifest.xml'
            exclude 'META-INF/services/javax.annotation.processing.Processor'
        }
    }
    buildFeatures {
        //noinspection DataBindingWithoutKapt
        dataBinding = true
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    productFlavors {
        signed {
            dimension "app"
            buildConfigField "String", "BASE_URL", '"https://alumframe.woodennayls.com/api/"'
            buildConfigField "String", "WEB_BASE_URL", '"https://alumframe.woodennayls.com/"'
            manifestPlaceholders = [enableCrashReporting: "true"]
        }
        development {
            dimension "app"
            buildConfigField "String", "BASE_URL", '"https://alumframe.woodennayls.com/api/"'
            buildConfigField "String", "WEB_BASE_URL", '"https://alumframedev.woodennayls.com/"'
            manifestPlaceholders = [enableCrashReporting: "true"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}



dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform("org.jetbrains.kotlin:kotlin-bom:2.1.21")
    implementation 'androidx.core:core-ktx:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    testImplementation 'junit:junit:4.13.2'
    implementation "androidx.multidex:multidex:2.0.1"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    // retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation 'com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"
    implementation "com.google.code.gson:gson:2.13.2"
    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // livedata
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    // Dagger-Hilt
    implementation "com.google.dagger:hilt-android:2.57.2"
    kapt "com.google.dagger:hilt-compiler:2.57.2"
    // navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.7"
    // dpi
    implementation "com.intuit.sdp:sdp-android:1.1.1"
    implementation "com.intuit.ssp:ssp-android:1.1.1"
    //Stetho
    implementation "com.facebook.stetho:stetho-okhttp3:1.6.0"
    // Glide
    implementation "com.github.bumptech.glide:glide:5.0.5"
    // Moshi
    kapt "com.squareup.moshi:moshi-kotlin-codegen:1.15.2"
    implementation "com.squareup.moshi:moshi:1.15.2"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    implementation "com.squareup.moshi:moshi-adapters:1.15.2"
    implementation "androidx.paging:paging-runtime-ktx:3.4.2"
    //pdf
    implementation 'com.itextpdf:itextpdf:5.5.13.5'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //lottie
    implementation "com.airbnb.android:lottie:6.7.1"
}
